version: "3"
services:
  pg_vector_postgres_dev:
    image: timescale/timescaledb-ha:pg17
    restart: unless-stopped
    container_name: pgvector
    # ports:
    #   - "5442:5442"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    env_file:
      - .env
    networks:
      pg_vector_dev:
        ipv4_address: 192.168.51.12

networks:
  pg_vector_dev:
    driver: bridge
    ipam:
        driver: default
        config:
            - 
              subnet: 192.168.51.0/24
