[package]
name = "candle-rag-example"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
# Candle ML framework
candle-core = { git = "https://github.com/danielclough/candle.git", branch = "feat/nomic-embed-text" }
candle-nn = { git = "https://github.com/danielclough/candle.git", branch = "feat/nomic-embed-text" }
candle-transformers = { git = "https://github.com/danielclough/candle.git", branch = "feat/nomic-embed-text" }

# Tokenizers & model hub
tokenizers = { version = "0.20", features = ["onig"] }
hf-hub = { version = "0.4", features = ["tokio"] }

# PostgreSQL + pgvector
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "postgres"] }
pgvector = { version = "0.4", features = ["sqlx"] }
tokio = { version = "1", features = ["full"] }

# SQLite + sqlite-vec
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1"
bytemuck = { version = "1", features = ["derive"] }

# Serialization & data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"

# CLI & utilities
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dotenvy = "0.15"
